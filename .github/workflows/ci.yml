name: CI
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc

            - name: Forbid non-exact versions in package.json
              run: jq -e '[(.dependencies, .devDependencies, .optionalDependencies) // {} | .[]] | all(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json

            - name: Install dependencies
              run: npm ci --ignore-scripts

    build-package:
        needs: build-and-test
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
            security-events: write
        uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build-package.yml@46d77cf57ff9388e39a46a315f6dcbe29a4b4638
